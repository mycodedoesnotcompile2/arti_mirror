[package]
name = "tor-geoip"
version = "0.47.0"
authors = ["The Tor Project, Inc.", "eta <eta@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "A crate to parse C Tor GeoIP CSV files."
keywords = ["tor", "arti"]
categories = ["parser-implementations", "network-programming"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[dependencies]
derive-deftly = { version = "~1.14.0", features = ["full", "beta"], optional = true }
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_with = { version = "3.24.0", optional = true }
thiserror = "2"
tor-geoip-db = { version = "0.1.1", optional = true }
tor-rpcbase = { version = "0.47.0", path = "../tor-rpcbase", optional = true }

[features]
embedded-db = ["tor-geoip-db"]
default = ["embedded-db"]
full = ["embedded-db", "rpc", "serde"]

rpc = ["dep:derive-deftly", "serde", "dep:tor-rpcbase"]
serde = ["dep:serde", "serde_with"]

experimental = ["export"]
export = ["__is_experimental"]
__is_experimental = []

[dev-dependencies]
proptest = "1.12.0"
rangemap = "1.8"

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "geoip-convert-mm-format"
path = "bin/convert.rs"
test = false
bench = false
required-features = ["export"]
