[package]
name = "tor-hsdir"
version = "0.48.0"
authors = ["The Tor Project, Inc.", "Nick Mathewson <nickm@torproject.org>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://gitlab.torproject.org/tpo/core/arti/-/wikis/home"
description = "Back-end support for Tor hidden service directories"
keywords = ["tor", "arti", "cryptography"]
categories = ["cryptography"]
repository = "https://gitlab.torproject.org/tpo/core/arti.git/"

[features]
default = []
full = []

experimental = []
__is_experimental = []

[dependencies]
aes-gcm = "0.11.1"
base64ct = "1.8.3"
rand = "0.10.3"
rusqlite = { version = ">=0.36.0, <0.41.0", features = ["time"] }
saturating-time = { path = "../saturating-time", version = "0.6.0" }
subtle = "2"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tiny-keccak = { version = "2.0.2", features = ["tuple_hash"] }
tor-error = { path = "../tor-error", version = "0.48.0" }
tor-hscrypto = { path = "../tor-hscrypto", version = "0.48.0" }
tor-llcrypto = { path = "../tor-llcrypto", version = "0.48.0" }
weak-table = "0.4.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27"
tor-basic-utils = { path = "../tor-basic-utils", version = "0.48.0" }

[package.metadata.docs.rs]
all-features = true
